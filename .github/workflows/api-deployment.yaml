name: api-deployment
run-name: Deploy da API
on: 
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with: 
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: domeneghetti/programacao-devops-backend:latest

      - name: Azure WebApp
        uses: Azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ secrets.APP_NAME }}
          image: domeneghetti/programacao-devops-backend:latest
          publish-profile: ${{ secrets.PUBLISH_PROFILE }}

  
